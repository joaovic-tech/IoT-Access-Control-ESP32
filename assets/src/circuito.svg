<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="-248.9 0 2097.8 1180" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1600" height="1180" fill="#ffffff"/>

  <!-- Título -->
  <text x="800" y="60" text-anchor="middle" font-size="34" font-weight="bold" fill="#1f2937">People Detect — ESP32-CAM + Sensor PIR + LED</text>
  <text x="800" y="98" text-anchor="middle" font-size="19" fill="#6b7280">Alimentação por regulador de tensão com saída de 5 V</text>

  <!-- ============ FIOS ============ -->
  <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fonte -> Regulador -->
    <polyline points="150,300 150,380" stroke="#dc2626"/>
    <polyline points="260,300 260,380" stroke="#111827"/>

    <!-- Barramento 5V -->
    <polyline points="570,190 1090,190" stroke="#dc2626"/>
    <polyline points="330,440 420,440 420,190 570,190" stroke="#9333ea"/>
    <polyline points="650,420 570,420 570,190" stroke="#dc2626"/>
    <polyline points="1180,400 1180,440 1090,440 1090,190" stroke="#dc2626"/>

    <!-- Barramento GND -->
    <polyline points="530,940 1360,940" stroke="#111827"/>
    <polyline points="330,560 460,560 460,940 530,940" stroke="#6b7280" stroke-width="9"/>
    <polyline points="330,560 460,560 460,940 530,940" stroke="#ffffff" stroke-width="5"/>
    <polyline points="650,470 530,470 530,940" stroke="#111827"/>
    <polyline points="1360,400 1360,940" stroke="#111827"/>

    <!-- Sinal PIR OUT -> GPIO13 -->
    <polyline points="650,570 600,570 600,870 1270,870 1270,400" stroke="#9333ea"/>

    <!-- GPIO16 -> LED -> resistor -> GND -->
    <polyline points="870,470 1000,470 1000,510" stroke="#16a34a"/>
    <polyline points="1000,560 1000,610" stroke="#2563eb"/>
    <polyline points="1000,710 1000,770 870,770" stroke="#111827"/>
  </g>

  <!-- Junções -->
  <g fill="#dc2626"><circle cx="570" cy="190" r="9"/></g>
  <g fill="#111827"><circle cx="530" cy="940" r="9"/></g>

  <!-- Rótulos dos barramentos -->
  <text x="740" y="175" text-anchor="middle" font-size="20" font-weight="bold" fill="#dc2626">Barramento +5V</text>
  <text x="900" y="975" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Barramento GND (terra comum)</text>
  <text x="935" y="858" text-anchor="middle" font-size="17" fill="#7e22ce">sinal PIR OUT → GPIO 13</text>

  <!-- ============ FONTE DE ENTRADA ============ -->
  <rect x="80" y="190" width="250" height="110" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="3"/>
  <text x="205" y="228" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Fonte de entrada</text>
  <text x="205" y="256" text-anchor="middle" font-size="16" fill="#4b5563">(bateria / fonte DC)</text>
  <text x="150" y="290" text-anchor="middle" font-size="20" font-weight="bold" fill="#dc2626">+</text>
  <text x="260" y="290" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">−</text>

  <!-- ============ REGULADOR ============ -->
  <rect x="80" y="380" width="250" height="240" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <text x="205" y="470" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e3a8a">Regulador</text>
  <text x="205" y="496" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e3a8a">de tensão</text>
  <text x="205" y="526" text-anchor="middle" font-size="16" fill="#1e40af">saída ajustada: 5 V</text>
  <text x="150" y="410" text-anchor="middle" font-size="15" fill="#1e3a8a">IN+</text>
  <text x="260" y="410" text-anchor="middle" font-size="15" fill="#1e3a8a">IN−</text>
  <text x="318" y="446" text-anchor="end" font-size="15" font-weight="bold" fill="#7e22ce">OUT+ 5V</text>
  <text x="318" y="566" text-anchor="end" font-size="15" font-weight="bold" fill="#111827">OUT− GND</text>
  <g fill="#9ca3af" stroke="#374151" stroke-width="2">
    <circle cx="150" cy="380" r="7"/><circle cx="260" cy="380" r="7"/>
    <circle cx="330" cy="440" r="7"/><circle cx="330" cy="560" r="7"/>
  </g>

  <!-- ============ ESP32-CAM ============ -->
  <rect x="650" y="290" width="220" height="520" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
  <text x="760" y="275" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">ESP32-CAM</text>
  <!-- câmera -->
  <rect x="722" y="305" width="76" height="76" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="760" cy="343" r="24" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
  <circle cx="760" cy="343" r="10" fill="#1e3a8a"/>
  <!-- pinos esquerdos -->
  <g font-size="16" fill="#e5e7eb">
    <text x="670" y="426">5V</text>
    <text x="670" y="476">GND</text>
    <text x="670" y="526" fill="#94a3b8">IO12</text>
    <text x="670" y="576" font-weight="bold" fill="#d8b4fe">IO13</text>
    <text x="670" y="626" fill="#94a3b8">IO15</text>
    <text x="670" y="676" fill="#94a3b8">IO14</text>
    <text x="670" y="726" fill="#94a3b8">IO2</text>
    <text x="670" y="776" fill="#94a3b8">IO4</text>
  </g>
  <!-- pinos direitos -->
  <g font-size="16" fill="#e5e7eb" text-anchor="end">
    <text x="850" y="426" fill="#94a3b8">3V3</text>
    <text x="850" y="476" font-weight="bold" fill="#86efac">IO16</text>
    <text x="850" y="526" fill="#94a3b8">IO0</text>
    <text x="850" y="576" fill="#94a3b8">GND</text>
    <text x="850" y="626" fill="#94a3b8">VCC</text>
    <text x="850" y="676" fill="#94a3b8">U0R</text>
    <text x="850" y="726" fill="#94a3b8">U0T</text>
    <text x="850" y="776">GND</text>
  </g>
  <g fill="#d4a017" stroke="#78350f" stroke-width="1.5">
    <circle cx="650" cy="420" r="7"/><circle cx="650" cy="470" r="7"/><circle cx="650" cy="520" r="7"/><circle cx="650" cy="570" r="7"/>
    <circle cx="650" cy="620" r="7"/><circle cx="650" cy="670" r="7"/><circle cx="650" cy="720" r="7"/><circle cx="650" cy="770" r="7"/>
    <circle cx="870" cy="420" r="7"/><circle cx="870" cy="470" r="7"/><circle cx="870" cy="520" r="7"/><circle cx="870" cy="570" r="7"/>
    <circle cx="870" cy="620" r="7"/><circle cx="870" cy="670" r="7"/><circle cx="870" cy="720" r="7"/><circle cx="870" cy="770" r="7"/>
  </g>

  <!-- ============ LED + RESISTOR ============ -->
  <!-- LED: triângulo apontando para baixo (ânodo em cima) -->
  <polygon points="975,510 1025,510 1000,555" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
  <line x1="972" y1="558" x2="1028" y2="558" stroke="#7f1d1d" stroke-width="4"/>
  <g stroke="#ef4444" stroke-width="3" fill="none">
    <line x1="1032" y1="520" x2="1056" y2="500"/><polyline points="1046,500 1056,500 1056,510"/>
    <line x1="1034" y1="540" x2="1058" y2="520"/><polyline points="1048,520 1058,520 1058,530"/>
  </g>
  <text x="1072" y="520" font-size="18" font-weight="bold" fill="#1f2937">LED</text>
  <text x="1072" y="543" font-size="14" fill="#4b5563">ânodo (+) perna longa</text>
  <text x="1072" y="562" font-size="14" fill="#4b5563">cátodo (−) perna curta</text>
  <!-- Resistor zigue-zague -->
  <polyline points="1000,610 1000,620 1016,630 984,645 1016,660 984,675 1016,690 1000,700 1000,710" fill="none" stroke="#92400e" stroke-width="4" stroke-linejoin="round"/>
  <text x="1030" y="655" font-size="18" font-weight="bold" fill="#1f2937">Resistor 220 Ω</text>
  <text x="1030" y="677" font-size="14" fill="#4b5563">(vermelho-vermelho-marrom)</text>
  <text x="935" y="460" text-anchor="middle" font-size="15" fill="#15803d">GPIO 16</text>

  <!-- ============ SENSOR PIR ============ -->
  <rect x="1120" y="240" width="300" height="160" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="3"/>
  <path d="M 1215 300 A 55 55 0 0 1 1325 300 Z" fill="#f8fafc" stroke="#9ca3af" stroke-width="3"/>
  <text x="1270" y="228" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Sensor PIR HC-SR501</text>
  <text x="1270" y="335" text-anchor="middle" font-size="15" fill="#065f46">(saída de sinal 3,3 V)</text>
  <text x="1180" y="388" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">VCC</text>
  <text x="1270" y="388" text-anchor="middle" font-size="16" font-weight="bold" fill="#7e22ce">OUT</text>
  <text x="1360" y="388" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">GND</text>
  <g fill="#d4a017" stroke="#78350f" stroke-width="1.5">
    <circle cx="1180" cy="400" r="7"/><circle cx="1270" cy="400" r="7"/><circle cx="1360" cy="400" r="7"/>
  </g>

  <!-- ============ LEGENDA ============ -->
  <rect x="60" y="690" width="370" height="290" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
  <text x="80" y="725" font-size="19" font-weight="bold" fill="#1f2937">Legenda dos fios</text>
  <g stroke-linecap="round">
    <line x1="80" y1="752" x2="130" y2="752" stroke="#9333ea" stroke-width="6"/>
    <line x1="80" y1="780" x2="130" y2="780" stroke="#6b7280" stroke-width="9"/>
    <line x1="80" y1="780" x2="130" y2="780" stroke="#ffffff" stroke-width="5"/>
    <line x1="80" y1="808" x2="130" y2="808" stroke="#dc2626" stroke-width="6"/>
    <line x1="80" y1="836" x2="130" y2="836" stroke="#111827" stroke-width="6"/>
    <line x1="80" y1="864" x2="130" y2="864" stroke="#9333ea" stroke-width="6"/>
    <line x1="80" y1="892" x2="130" y2="892" stroke="#16a34a" stroke-width="6"/>
    <line x1="80" y1="920" x2="130" y2="920" stroke="#2563eb" stroke-width="6"/>
  </g>
  <g font-size="16" fill="#374151">
    <text x="145" y="758">Regulador OUT+ (5 V)</text>
    <text x="145" y="786">Regulador OUT− (GND)</text>
    <text x="145" y="814">+5 V / PIR VCC</text>
    <text x="145" y="842">GND (terra) / PIR GND</text>
    <text x="145" y="870">Sinal PIR OUT → GPIO 13</text>
    <text x="145" y="898">GPIO 16 → ânodo do LED</text>
    <text x="145" y="926">Cátodo do LED → resistor</text>
  </g>
  <circle cx="105" cy="955" r="9" fill="#111827"/>
  <text x="125" y="961" font-size="16" fill="#374151">= ponto de junção (fios conectados)</text>

  <!-- ============ NOTAS ============ -->
  <rect x="60" y="1010" width="1480" height="140" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="85" y="1045" font-size="18" font-weight="bold" fill="#92400e">Observações</text>
  <g font-size="16" fill="#78350f">
    <text x="85" y="1075">• Meça a saída do regulador com multímetro antes de ligar: deve marcar ~5,0 V. Todos os GND precisam estar interligados.</text>
    <text x="85" y="1102">• Não alimente pelo regulador e pelo USB (ESP32-CAM-MB) ao mesmo tempo; use o USB só para gravar o código, se possível.</text>
    <text x="85" y="1129">• O LED pode voltar ao GND de qualquer pino GND do ESP32-CAM (aqui usado o GND do lado direito, junto ao U0T).</text>
  </g>
</svg>
